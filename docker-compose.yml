# Optional Docker Compose (not required for production deploy)
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asyncgram
      POSTGRES_PASSWORD: password
      POSTGRES_DB: asyncgram
    ports:
      - "5432:5432"
